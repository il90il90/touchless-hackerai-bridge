# Release on this PC's self-hosted runner: push a tag like v1.2.3 to build the image and publish a GitHub Release.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to release (e.g. v1.0.0)", required: true }
permissions: { contents: write }
jobs:
  release:
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: 'C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}'
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - name: Build the Docker image
        run: docker build -t "touchless-hackerai-bridge:$TAG" .
      - name: Package
        run: |
          mkdir -p dist
          docker save "touchless-hackerai-bridge:$TAG" | gzip > "dist/touchless-hackerai-bridge-$TAG-image.tar.gz"
          git archive --format=zip --prefix="touchless-hackerai-bridge-$TAG/" -o "dist/touchless-hackerai-bridge-$TAG.zip" HEAD
      - name: Publish the GitHub Release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
